[project]
name = "rss-headlines-mcp"
version = "1.0.0"
description = "MCP server: merged, keyword-filterable headlines from configurable RSS/Atom feeds, compact enough for a voice assistant turn"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mcp>=1.10,<2", "httpx>=0.27"]

[project.scripts]
rss-headlines-mcp = "rss_headlines_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rss_headlines_mcp"]
